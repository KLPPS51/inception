[www]

user  = nobody
group = nobody

; "9000" and not "127.0.0.1:9000". nginx runs in a different container,
; which is a different host on the Docker network, so php-fpm has to
; listen on every interface for nginx to reach it.
listen = 9000
listen.owner = nobody
listen.group = nobody
listen.mode  = 0660

pm                   = dynamic
pm.max_children      = 10
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Keep the container's environment variables. With the default
; (clear_env = yes) php-fpm wipes them and the entrypoint's
; configuration would not reach PHP.
clear_env = no

; Send the workers' output to the container's stdout, so that it shows
; up in `docker logs wordpress`.
catch_workers_output = yes
php_admin_value[error_log] = /var/log/php-fpm.log
php_admin_flag[log_errors] = on

user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid       /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;

    sendfile          on;
    keepalive_timeout 65;
    client_max_body_size 64m;

    server {
        # The only entry point of the whole infrastructure. Port 80 is
        # never opened, so plain HTTP simply cannot connect.
        listen      443 ssl;
        listen [::]:443 ssl;

        server_name mobullad.42.fr;

        ssl_certificate     /etc/nginx/ssl/inception.crt;
        ssl_certificate_key /etc/nginx/ssl/inception.key;

        # The subject allows TLSv1.2 and TLSv1.3 only. Naming them here
        # disables SSLv3, TLSv1.0 and TLSv1.1.
        ssl_protocols TLSv1.2 TLSv1.3;

        # Shared with the wordpress container through the
        # wordpress_data named volume.
        root  /var/www/html;
        index index.php index.html;

        location / {
            try_files $uri $uri/ /index.php?$args;
        }

        # nginx does not execute PHP. It hands the request to php-fpm in
        # the wordpress container over FastCGI. "wordpress" is resolved
        # by Docker's embedded DNS on the inception network.
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass   wordpress:9000;
            fastcgi_index  index.php;
            include        fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param  PATH_INFO       $fastcgi_path_info;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
